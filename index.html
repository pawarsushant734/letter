<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letter 💌</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="hearts-container">
      <span>♥</span>
      <span>♥</span>
      <span>♥</span>
      <span>♥</span>
      <span>♥</span>
      <span>♥</span>
      <span>♥</span>
      <span>♥</span>
    </div>

    <div class="envelope">

      <div class="letter" id="letter">
        <h2>💌 A Special Letter</h2>

        <p>
          To Someone Special ❤️
        </p>

        <p>
          You bring a little more happiness, kindness
          and brightness into every ordinary day.
        </p>

        <p>
          Thank you for being such a wonderful person.
          Keep smiling and keep shining! ✨
        </p>

        <h3>With lots of good wishes ❤️</h3>
      </div>

      <div class="flap"></div>

    </div>

    <div class="buttons">
      <button id="openBtn">OPEN</button>
      <button id="resetBtn">RESET</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
